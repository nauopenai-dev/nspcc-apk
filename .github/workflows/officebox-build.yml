name: Build OfficeBox APK
on:
  push:
    branches:
      - officebox-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: tar -xJf OfficeBox-Android-source.tar.xz
      - name: Compile APK
        working-directory: OfficeBox
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s OfficeBox/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p APK
          cp OfficeBox/app/build/outputs/apk/debug/app-debug.apk APK/OfficeBox-debug.apk
          sha256sum APK/OfficeBox-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeBox-installable-apk
          path: APK/OfficeBox-debug.apk
      - name: Publish download file to build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f APK/OfficeBox-debug.apk
          git commit -m "Publish OfficeBox APK [skip ci]"
          git push
